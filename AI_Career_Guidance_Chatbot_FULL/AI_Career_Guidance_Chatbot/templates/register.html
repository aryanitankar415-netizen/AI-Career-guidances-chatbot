{% extends "base.html" %}
{% block title %}Register — CareerGuide{% endblock %}
{% block content %}
<section class="auth-page"><div class="auth-card"><div class="brand big">✦ Career<span>Guide AI</span></div><h1>Create account</h1><p>Save your conversations and return to them later.</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="post"><label>Full name</label><input name="name" required><label>Email</label><input name="email" type="email" required><label>Password</label><input name="password" type="password" minlength="6" required><button class="btn primary full">Create account</button></form><p class="auth-switch">Already registered? <a href="{{ url_for('login') }}">Login</a></p></div></section>
{% endblock %}
