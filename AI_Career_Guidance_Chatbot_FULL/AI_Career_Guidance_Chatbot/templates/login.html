{% extends "base.html" %}
{% block title %}Login — CareerGuide{% endblock %}
{% block content %}
<section class="auth-page"><div class="auth-card"><div class="brand big">✦ Career<span>Guide AI</span></div><h1>Welcome back</h1><p>Login to save your AI chat history.</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="post"><label>Email</label><input name="email" type="email" required><label>Password</label><input name="password" type="password" required><button class="btn primary full">Login</button></form><p class="auth-switch">No account? <a href="{{ url_for('register') }}">Create one</a></p></div></section>
{% endblock %}
